    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: "Love";
            src: url("fonts/KINKEE__.TTF") format("opentype");
            font-weight: normal;
            font-style: normal;
            /*
            tipos de format()
            truetype (ttf), opentype (otf), woff, woff2, svg, eot (embeddable open type)
            */
        
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 20px;
            color: #000;
            text-align: left;
        }
        h1{
            font-family: Love, Helvetica, sans-serif;
            font-size: 50px;
            color: #000;

            text-align: center;
        }
        p{
            font-family: Love, Helvetica, sans-serif;
            font-size: 20px;
            color: #000;
            text-align: justify;
            text-indent: 50px;
        }
    </style>
</head>
