<!DOCTYPE html>
<html lang="pt-br>
<head>
    <meta charset=" UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>formulario</title>
</head>

<body>
    <form action="icadas.php" method="post" autocomplete="on">
        <fieldset>
            <legend>Cadastro</legend>
            <p>
                <label for="iname">Nome:</label>
                <input type="text" name="name" id="iname" autocomplete="name" placeholder="Nome completo" required>
            </p>
            <p>
                <label for="iadress">Endereço:</label>
                <input type="text" name="address" id="iadress" placeholder="Endereço" autocomplete="address-level1"
                    required>
            </p>
            <p>
                <label for="imail">Email:</label>
                <input type="email" name="email" id="imail" placeholder="E-mail" autocomplete="email" required>
            </p>
            <p>
                <label for="itel">Telefone:</label>
                <input type="tel" name="tel" id="itel" placeholder="Telefone" autocomplete="tel"
                    pattern="^(\(\d{2}\) )?[0-9]{4,5}-[0-9]{4}$" required>
            </p>
            <p>
                <label for="nacionalidade">Nacionalidade:</label>
                <input type="text" name="nacionalidade" id="nacionalidade" placeholder="Nacionalidade"
                    autocomplete="country" required>
            </p>
            <p>
                <label for="nascimento">Data de Nascimento:</label>
                <input type="date" name="nascimento" id="nascimento" required>
            </p>
        </fieldset>



        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
</body>

</html>
