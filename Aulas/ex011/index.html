<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens dinamicas</title>
</head>
<body>
    <h1>Imagens dinamicas</h1>
    <picture>
        <source media="(max-width: 750px)" srcset="Imagens/Imagem-pequena.png" type="image/png">
        <source media="(max-width: 1000px)" srcset="Imagens/Imagem-media.png" type="image/png">
        <img src="Imagens/Imagem-grande.png" alt="Imagem grande">
    </picture>

    <h1>Reproduzindo audios</h1>
    <audio src="midia/happy-mistake.mp3" controls autoplay></audio>
    <br>
    <audio preload="metadata" autoplay controls>
        <source src="midia/guanacast-33.mp3" type="audio/mpeg">
        <source src="midia/guanacast-33.mp3" type="audio/mpeg">
        <source src=""midia/guanacast-33.ogg" type="audio/ogg">
        <source src="midia/guanacast-33.wav" type="audio/wav">
        Seu navegador não suporta o elemento de áudio.  
    </audio>
    

    
</body>
</html>
