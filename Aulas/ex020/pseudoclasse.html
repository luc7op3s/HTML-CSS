<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudoclasses</title>
    <style>
        div {
            display: inline-block;
            width: 100px;
            height: 100px;
            background-color: red;
            margin: 10px;
            text-align: center;
            border: 1px solid black;

        }
        div:hover {
            background-color: blue;
        }
    
</style>
</head>
<body>
    <div id="d1">d1</div>
    <div id="d2">d2</div>
    <div id="d3">d3</div>
</body>
</html>
