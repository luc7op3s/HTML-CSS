<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links</title>
    <style>
        /* 
        # = id
        . = class
        : pseudo-class
        :: pseudo-element
        > = child
        */
        
        body {
            font-fanmily: Arial, sans-serif; 
        }
        a {
            text-decoration: none;
            font-weight: bold;
            color: blue;
        }

        a:visited {
            color: purple;
        }
        a:hover {
            color: red;
            text-decoration: underline;

        }  
        a::active {
            color: green;
        } 
        a::after {
            content: " (link externo)";
            font-size: 0.8em;
            color: gray;
            font-style: italic;
            font-weight: normal;
        }
        .doom {
            background-color: lightblue;
            padding: 5px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
       <li><a href="https://gustavoguanabara.github.io" target="_blank" class="doom">Repositorio Github</a></li>
       <li><a href="https://www.youtube.com/user/gustavoguanabara" target="_blank">Canal do Youtube</a></li>
       <li><a href="https://www.cursoemvideo.com" target="_blank">Site do Curso</a></li>
    </ul>
</body>
</html>
