<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de hover</title>
    <style>
        div {
            width: 200px;
            height: 50px;
            background-color: lightgray;
            text-align: center;
            line-height: 50px;
            margin-top: 20px;
            transition: background-color 0.3s ease;
        }
        div:hover {
            background-color: lightblue;
        }   
        div > p {
            display: none;
            margin: 0;
        }
        div:hover > p {
            display: block;
            color: white;
            background-color: red;
        }
    </style>
</head>
<body>
    <h1>Exemplo de hover</h1>
    <p>Passe o mouse sobre o texto para ver o efeito de hover.</p>
    <div>
        Passe o mouse aqui
        <p>TEXTO ESCONDIDO</p>
    </div>
    <p>Fim do exemplo</p>
</body>
</html>
