<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grouping Tags</title>
<style>
    body{
        font-family: Arial, sans-serif;
        background-color: aquamarine

    }
    header{
        width: 600px;
        background-color: lightgray;
        padding: 10px;
        margin: 10px auto;
    }
    nav{
        width: auto;
        background-color: rgb(110, 110, 110);
        padding: 10px;
        margin: 10px auto;
        box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.5);
        border-radius: 5px 10px;
        
    }
    nav a{
        background-color: rgb(255, 255, 255);
        padding: 10px;
        margin: 10px auto;
        text-decoration: none;
        font-weight: bold;

    }
    nav > a:hover{
        text-decoration: underline;
        background-color: lightgreen;
    }
    main{
        width: 600px;
        background-color: lightblue;
        padding: 10px;
        margin: 10px auto;
    }
    h1{
        text-align: center;
    }
    article{
        background-color: lightyellow;
        padding: 10px;
        margin: 10px auto;
    }
    article > aside{
        background-color: lightgreen;
        padding: 10px;
        margin: 10px auto;
}
    footer{background-color: rgb(0, 0, 0);
       color: white;
        width: 600px;
        text-align: center;
        padding: 10px;
        margin: 10px auto;
    }
    footer > p{
        margin: 0;
    }
    main{
        border-radius: 5px;
        box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.5);
    }
    div.bola{
        width:50px;
        height:50px;
        background-color:white;
        display: flex;
        margin: 10px auto;
        border-radius: 50%;

    }
</style>
</head>
<body>
    <header>
        <h1>Meu Site</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Sobre</a>
            <a href="#">Contato</a>
        </nav>
        
    </header>
    <main> 
        <section id="Assuntos">
            <p>Esportes Politica Tecnologia</p>
        </section>
        <section id="noticias">
            <article>
                <h2>Noticia sobre o brasil</h2>
                <p>Este é o conteúdo da noticia sobre o brasil.</p>
                <aside>
                    <p>Artigo Escrito por Jose da silva</p>
                </aside>
            </article>
            <article>
                <h2>Artigo 2</h2>
                <p>Este é o conteúdo do artigo 2.</p>
            </article>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Meu Site. Todos os direitos reservados.</p>
    </footer>
    <div class="bola">
</body> 
</html>
