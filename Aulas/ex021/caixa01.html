<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        h1{
            /** box level
            margin: auto;
            display: block;
            height: 300px;
            width: 300px;
            background-color: lightgray;
            border-width: 10px;
            border-style: solid;
            border-color: black;

            margin-top: 50px;
            margin-bottom: 50px;
            outline: 5px dashed black;
            **/

            /*Shorthands*/
            border: 10px solid lightgray;
            padding: 20px;
            margin: 50px auto;
            outline: 5px dashed black;
           
        }
        a{/*/ inline level */
            display:block;
            border-width: 2px;
            border-style: double;
            border-color: black;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box level</h1>
    <p>Paragrafos tambem são exemplos de box level, mas os <a href="#">links</a> são exemplos de box inline.</p>


    
</body>
</html>
